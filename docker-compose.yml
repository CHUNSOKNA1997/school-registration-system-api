services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: school-registration-api:latest
    container_name: school-registration-app
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: ${DB_CONNECTION:-sqlite}
      DB_DATABASE: ${DB_DATABASE:-/var/www/html/database/database.sqlite}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      RUN_MIGRATIONS: "true"
    ports:
      - "8000:8000"
    volumes:
      - app_storage:/var/www/html/storage
      - app_database:/var/www/html/database
    restart: unless-stopped

  queue:
    image: school-registration-api:latest
    container_name: school-registration-queue
    depends_on:
      - app
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: ${DB_CONNECTION:-sqlite}
      DB_DATABASE: ${DB_DATABASE:-/var/www/html/database/database.sqlite}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      RUN_MIGRATIONS: "false"
    command: ["php", "artisan", "queue:work", "database", "--queue=default", "--sleep=3", "--tries=3", "--max-time=3600"]
    volumes:
      - app_storage:/var/www/html/storage
      - app_database:/var/www/html/database
    restart: unless-stopped

  scheduler:
    image: school-registration-api:latest
    container_name: school-registration-scheduler
    depends_on:
      - app
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: ${DB_CONNECTION:-sqlite}
      DB_DATABASE: ${DB_DATABASE:-/var/www/html/database/database.sqlite}
      RUN_MIGRATIONS: "false"
    command: ["sh", "-lc", "while true; do php artisan schedule:run --no-interaction; sleep 60; done"]
    volumes:
      - app_storage:/var/www/html/storage
      - app_database:/var/www/html/database
    restart: unless-stopped

volumes:
  app_storage:
  app_database:
