; Supervisor config for Laravel queue worker
; Copy this file to: /etc/supervisor/conf.d/laravel-queue-worker.conf
;
; IMPORTANT: Update command path, user, and logfile paths for your server.

[program:laravel-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/school-registration-system-api/artisan queue:work database --queue=default --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/school-registration-system-api/storage/logs/queue-worker.log
stopwaitsecs=3600

; Increase numprocs if you want parallel queue workers.
; numprocs=2
